services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: buyandbye_api
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_NAME: BuyAndBye
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-buyandbye}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - buyandbye_network

  web:
    build:
      context: ../BuyAndByeWeb
      dockerfile: ../BuyAndByeApi/docker/web/Dockerfile
    container_name: buyandbye_web
    working_dir: /app
    volumes:
      - ../BuyAndByeWeb:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_APP_NAME: "Buy & Bye"
      VITE_APP_ENV: development
    depends_on:
      - api
    networks:
      - buyandbye_network

  postgres:
    image: postgres:16
    container_name: buyandbye_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_ROOT_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-buyandbye}
    command: >
      postgres
      -c app.db_user=${DB_USERNAME:-app}
      -c app.db_password=${DB_PASSWORD:-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - buyandbye_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: buyandbye_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - buyandbye_network

volumes:
  postgres_data:
    driver: local

networks:
  buyandbye_network:
    driver: bridge
